name: Actualizacion Diaria de Pronosticos

on:
  schedule:
    # Ejecutar todos los dias a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecucion manual con un clic

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          rm -f package-lock.json bun.lock
          npm install --legacy-peer-deps

      - name: Ejecutar consulta y predicciones
        run: npx tsx scripts/update-predictions.ts

      - name: Guardar o commitear datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data_league_*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(cron): actualización diaria de pronosticos TheFishy"
          git push origin HEAD:main || git push origin HEAD:master || echo "Push completed or skipped"
